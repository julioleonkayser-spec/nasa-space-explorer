<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Space Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <header>
    <!-- if your starter has the NASA logo image, put it here instead of the text -->
    <span class="logo">NASA</span>
    <h1>Space Explorer</h1>
  </header>

  <main>
    <!-- random space fact -->
    <div class="fact-box">
      <h2>Did You Know?</h2>
      <p id="fact-text"></p>
    </div>

    <!-- date picker -->
    <div class="filters">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button id="getImages">Get Space Images</button>
    </div>

    <!-- the gallery -->
    <div id="gallery">
      <p class="placeholder">Pick a date range and press "Get Space Images" to start exploring!</p>
    </div>
  </main>

  <!-- the modal (hidden until you click a picture) -->
  <div id="modal" class="hidden">
    <div class="modal-content">
      <button id="close-modal" aria-label="Close">&times;</button>
      <div id="modal-media"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-date"></p>
      <p id="modal-text"></p>
    </div>
  </div>

  <footer>
    <p>Pictures and info come from NASA's Astronomy Picture of the Day (APOD). Student project.</p>
  </footer>

  <script src="dateRange.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
